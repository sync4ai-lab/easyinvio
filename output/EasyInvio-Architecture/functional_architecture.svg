<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1412" viewBox="0 0 1500 1412" role="img">
<title>Functional architecture</title><desc>Business and individual workspaces share one shipping and financial lifecycle.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1500" height="1412" fill="#f8fafc"/>
<text x="48" y="65" style="font:700 34px Arial,sans-serif;fill:#0f172a">EasyInvio | Functional architecture</text>
<text x="48" y="105" style="font:19px Arial,sans-serif;fill:#475569">Business and individual workspaces share one shipping and financial lifecycle.</text>
<path d="M488 270L526 270" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M966 270L1004 270" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1224 380L268 438" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M488 548L526 548" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M966 548L1004 548" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1224 658L268 716" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M488 826L526 826" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M966 826L1004 826" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1224 936L268 994" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1224 936L746 994" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1224 936L1224 994" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g data-node="join"><rect x="48" y="160" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="48" y="160" width="6" height="220" rx="3" fill="#059669"/>
<text x="70" y="198" style="font:700 22px Arial,sans-serif;fill:#0f172a">01 Register and verify</text>
<text x="70" y="238" style="font:18px Arial,sans-serif;fill:#334155">Business or personal profile</text>
<text x="70" y="262" style="font:18px Arial,sans-serif;fill:#334155">Website / WhatsApp identity proof</text>
</g>
<g data-node="setup"><rect x="526" y="160" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="526" y="160" width="6" height="220" rx="3" fill="#4f46e5"/>
<text x="548" y="198" style="font:700 22px Arial,sans-serif;fill:#0f172a">02 Configure workspace</text>
<text x="548" y="238" style="font:18px Arial,sans-serif;fill:#334155">Team; addresses; contacts; products</text>
<text x="548" y="262" style="font:18px Arial,sans-serif;fill:#334155">Return warehouse; carrier access</text>
</g>
<g data-node="intake"><rect x="1004" y="160" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="1004" y="160" width="6" height="220" rx="3" fill="#059669"/>
<text x="1026" y="198" style="font:700 22px Arial,sans-serif;fill:#0f172a">03 Bring in orders</text>
<text x="1026" y="238" style="font:18px Arial,sans-serif;fill:#334155">Manual; CSV; stores; marketplace</text>
<text x="1026" y="262" style="font:18px Arial,sans-serif;fill:#334155">References and actionable row errors</text>
</g>
<g data-node="prepare"><rect x="48" y="438" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="48" y="438" width="6" height="220" rx="3" fill="#059669"/>
<text x="70" y="476" style="font:700 22px Arial,sans-serif;fill:#0f172a">04 Prepare real shipment</text>
<text x="70" y="516" style="font:18px Arial,sans-serif;fill:#334155">Measured boxes; goods allocation</text>
<text x="70" y="540" style="font:18px Arial,sans-serif;fill:#334155">Real addresses; customs review</text>
</g>
<g data-node="rate"><rect x="526" y="438" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="526" y="438" width="6" height="220" rx="3" fill="#4f46e5"/>
<text x="548" y="476" style="font:700 22px Arial,sans-serif;fill:#0f172a">05 Compare eligible rates</text>
<text x="548" y="516" style="font:18px Arial,sans-serif;fill:#334155">Business rules or individual markup</text>
<text x="548" y="540" style="font:18px Arial,sans-serif;fill:#334155">Deterministic top ten; optional badge</text>
</g>
<g data-node="select"><rect x="1004" y="438" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="1004" y="438" width="6" height="220" rx="3" fill="#059669"/>
<text x="1026" y="476" style="font:700 22px Arial,sans-serif;fill:#0f172a">06 Confirm selected offer</text>
<text x="1026" y="516" style="font:18px Arial,sans-serif;fill:#334155">Price; expiry; role; connection</text>
<text x="1026" y="540" style="font:18px Arial,sans-serif;fill:#334155">No model authorizes purchase</text>
</g>
<g data-node="pay"><rect x="48" y="716" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="48" y="716" width="6" height="220" rx="3" fill="#059669"/>
<text x="70" y="754" style="font:700 22px Arial,sans-serif;fill:#0f172a">07 Arrange payment</text>
<text x="70" y="794" style="font:18px Arial,sans-serif;fill:#334155">Workspace reservation or Stripe</text>
<text x="70" y="818" style="font:18px Arial,sans-serif;fill:#334155">Verified events; exact total/currency</text>
</g>
<g data-node="book"><rect x="526" y="716" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="526" y="716" width="6" height="220" rx="3" fill="#4f46e5"/>
<text x="548" y="754" style="font:700 22px Arial,sans-serif;fill:#0f172a">08 Buy and document</text>
<text x="548" y="794" style="font:18px Arial,sans-serif;fill:#334155">Native label confirmation; capture</text>
<text x="548" y="818" style="font:18px Arial,sans-serif;fill:#334155">PDF/forms; unknown outcomes retained</text>
</g>
<g data-node="track"><rect x="1004" y="716" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="1004" y="716" width="6" height="220" rx="3" fill="#059669"/>
<text x="1026" y="754" style="font:700 22px Arial,sans-serif;fill:#0f172a">09 Track and synchronize</text>
<text x="1026" y="794" style="font:18px Arial,sans-serif;fill:#334155">Milestones; exceptions; eligible POD</text>
<text x="1026" y="818" style="font:18px Arial,sans-serif;fill:#334155">Store and support outboxes</text>
</g>
<g data-node="returns"><rect x="48" y="994" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="48" y="994" width="6" height="220" rx="3" fill="#059669"/>
<text x="70" y="1032" style="font:700 22px Arial,sans-serif;fill:#0f172a">10 Return full parcel</text>
<text x="70" y="1072" style="font:18px Arial,sans-serif;fill:#334155">Return warehouse; fresh quote</text>
<text x="70" y="1096" style="font:18px Arial,sans-serif;fill:#334155">Retailer/customer pay; real QR or print</text>
</g>
<g data-node="resolve"><rect x="526" y="994" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="526" y="994" width="6" height="220" rx="3" fill="#4f46e5"/>
<text x="548" y="1032" style="font:700 22px Arial,sans-serif;fill:#0f172a">11 Resolve and reconcile</text>
<text x="548" y="1072" style="font:18px Arial,sans-serif;fill:#334155">Invoice disputes; eligible claims</text>
<text x="548" y="1096" style="font:18px Arial,sans-serif;fill:#334155">Evidence; verified settlement</text>
</g>
<g data-node="operate"><rect x="1004" y="994" width="440" height="220" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="1004" y="994" width="6" height="220" rx="3" fill="#059669"/>
<text x="1026" y="1032" style="font:700 22px Arial,sans-serif;fill:#0f172a">12 Operate platform</text>
<text x="1026" y="1072" style="font:18px Arial,sans-serif;fill:#334155">Cohort reports; margins; support</text>
<text x="1026" y="1096" style="font:18px Arial,sans-serif;fill:#334155">Audited client assistance</text>
</g>
<text x="48" y="1358" style="font:17px Arial,sans-serif;fill:#475569">Logical summary only. Tenant guards, exact money, provider readiness and unknown-outcome reconciliation remain authoritative.</text>
</svg>
